        var STAGES = [stage1, stage2, stage3, stage4, stage5];
        /* =====================================================
         * 15. ゲーム本体
         * ===================================================== */
        var STOMP_CHAIN = [100, 200, 400, 500, 800, 1000, 2000, 4000, 8000];

        function Game() {
          this.state = "title";
          this.stage = 1;
          this.score = 0;
          this.coins = 0;
          this.lives = 3;
          this.hiscore = 0;
          this.camX = 0;
          this.camY = 0;
          this.t = 0;
          this.ents = [];
          this.parts = [];
          this.pops = [];
          this.bumps = [];
          this.level = null;
          this.player = null;
          this.checkpoint = null;
          this.stateT = 0;
          this.music = true;
          this.flagDone = false;
          this.bossDown = false;
          this.shake = 0;
        }

        Game.prototype.reset = function () {
          this.stage = 1;
          this.score = 0;
          this.coins = 0;
          this.lives = 3;
          this.checkpoint = null;
        };

        Game.prototype.loadStage = function (n, fromCheckpoint) {
          this.stage = n;
          var L = STAGES[n - 1]();
          this.level = L;
          if (!fromCheckpoint) this.checkpoint = null;
          this.ents = [];
          this.parts = [];
          this.pops = [];
          this.bumps = [];
          this.flagDone = false;
          this.bossDown = false;
          this.timeLeft = L.time;
          this.shake = 0;
          this.flagY = L.goalTop != null ? L.goalTop + 6 : 0;

          var start =
            fromCheckpoint && this.checkpoint && this.checkpoint.stage === n
              ? { x: this.checkpoint.x, y: this.checkpoint.y }
              : L.start;

          var p = new Player(start.x, start.y);
          if (
            fromCheckpoint &&
            this.checkpoint &&
            this.checkpoint.stage === n
          ) {
            if (this.checkpoint.size === "big") p.setSize("big", L);
            p.power = this.checkpoint.power || "normal";
          }
          this.player = p;
          this.ents.push(p);

          for (var i = 0; i < L.spawns.length; i++) {
            var s = L.spawns[i];
            var e = this.makeEnt(s);
            if (e) this.ents.push(e);
          }
          this.camX = clamp(
            p.cx() - VIEW_W * 0.42,
            0,
            Math.max(0, L.w * T - VIEW_W),
          );
          this.camY = clamp(
            p.cy() - VIEW_H * 0.55,
            0,
            Math.max(0, L.h * T - VIEW_H),
          );
          this.state = "ready";
          this.stateT = 0;
          Snd.stopMusic();
        };

        Game.prototype.makeEnt = function (s) {
          var e = null;
          switch (s.type) {
            case "goomba":
              e = new Goomba(s.x, s.y);
              e.enemy = true;
              break;
            case "koopa":
              e = new Koopa(s.x, s.y);
              e.enemy = true;
              break;
            case "spiny":
              e = new Spiny(s.x, s.y);
              e.enemy = true;
              break;
            case "piranha":
              e = new Piranha(s.x, s.y, s.baseY);
              e.enemy = true;
              break;
            case "lakitu":
              e = new Lakitu(s.x, s.y);
              e.enemy = true;
              break;
            case "hammerbro":
              e = new HammerBro(s.x, s.y);
              e.enemy = true;
              break;
            case "bowser":
              e = new Bowser(s.x, s.y);
              e.enemy = true;
              break;
            case "coin":
              e = new Coin(s.x, s.y);
              break;
            case "plat":
              e = new MovingPlat(s.x, s.y, s.tiles, s);
              break;
            case "fallplat":
              e = new FallPlat(s.x, s.y, s.tiles);
              break;
            case "checkpoint":
              e = new Checkpoint(s.x, s.y);
              break;
          }
          if (e) {
            e.spawnX = e.x;
            e.spawnY = e.y;
          }
          return e;
        };

        /* ------------- スコア・演出 ------------- */
        Game.prototype.addScore = function (n, x, y, label) {
          this.score += n;
          if (this.score > this.hiscore) this.hiscore = this.score;
          if (x != null)
            this.pops.push(new Popup(x, y, label || String(n), "#ffffff"));
        };
        Game.prototype.puff = function (x, y) {
          for (var i = 0; i < 6; i++)
            this.parts.push(
              new Particle(
                x,
                y,
                (Math.random() - 0.5) * 90,
                (Math.random() - 0.5) * 90 - 20,
                i % 2 ? "#ffd23a" : "#ff8c18",
                0.35,
                2,
              ),
            );
        };
        Game.prototype.brickBits = function (tx, ty) {
          var cx = tx * T + T / 2,
            cy = ty * T + T / 2;
          var col = THEMES[this.level.theme].brick[0];
          for (var i = 0; i < 8; i++)
            this.parts.push(
              new Particle(
                cx,
                cy,
                (Math.random() - 0.5) * 170,
                -Math.random() * 210 - 40,
                i % 2 ? col : THEMES[this.level.theme].brick[1],
                0.9,
                3,
              ),
            );
        };

        /* ------------- ブロックを叩く ------------- */
        Game.prototype.bumpBlock = function (tx, ty, who) {
          var lv = this.level;
          var id = lv.get(tx, ty);
          if (!BUMPABLE[id]) {
            if (SOLID[id]) Snd.bump();
            return;
          }
          var key = tx + "," + ty;
          var item = lv.qitem[key];

          if (id === TL.BRICK && !item) {
            if (who.size === "big" || who.power === "fire") {
              lv.set(tx, ty, TL.EMPTY);
              this.brickBits(tx, ty);
              this.addScore(50);
              Snd.brk();
              this.knockEnemiesOn(tx, ty);
              return;
            }
            this.bumps.push(new BumpAnim(tx, ty));
            Snd.bump();
            this.knockEnemiesOn(tx, ty);
            return;
          }

          // ？ブロック or アイテム入りレンガ
          lv.set(tx, ty, TL.USED);
          delete lv.qitem[key];
          this.bumps.push(new BumpAnim(tx, ty));
          this.knockEnemiesOn(tx, ty);

          var px = tx * T + 1,
            py = ty * T;
          if (item === "coin" || !item) {
            this.coins++;
            this.addScore(200, tx * T + 8, ty * T - 6, "200");
            this.parts.push(
              new Particle(tx * T + 8, ty * T - 4, 0, -180, "#ffd23a", 0.5, 3),
            );
            Snd.coin();
            this.checkCoinLife();
          } else if (item === "power") {
            if (this.player.size === "small") {
              var m = new Mushroom(px, py, "mushroom");
              m.active = true;
              this.ents.push(m);
            } else {
              var f = new Flower(px, py);
              f.active = true;
              this.ents.push(f);
            }
            Snd.bump();
          } else if (item === "oneup") {
            var u = new Mushroom(px, py, "oneup");
            u.active = true;
            this.ents.push(u);
            Snd.bump();
          } else if (item === "star") {
            var st = new StarItem(px, py);
            st.active = true;
            this.ents.push(st);
            Snd.bump();
          }
        };

        Game.prototype.knockEnemiesOn = function (tx, ty) {
          var bx = tx * T,
            by = ty * T;
          for (var i = 0; i < this.ents.length; i++) {
            var e = this.ents[i];
            if (!e.enemy || e.remove || !e.active) continue;
            if (
              e.x + e.w > bx - 2 &&
              e.x < bx + T + 2 &&
              e.y + e.h > by - 20 &&
              e.y + e.h <= by + 6
            ) {
              this.defeatEnemy(e, true);
            }
          }
        };

        Game.prototype.checkCoinLife = function () {
          if (this.coins >= 100) {
            this.coins -= 100;
            this.lives++;
            Snd.oneup();
          }
        };

        /* ------------- 敵を倒す ------------- */
        Game.prototype.defeatEnemy = function (e, flip) {
          if (e.remove || e.defeated) return;
          if (e.boss) {
            e.damage(this);
            return;
          }
          e.defeated = true;
          e.remove = true;
          this.addScore(200, e.cx(), e.y, "200");
          Snd.kick();
          for (var i = 0; i < 5; i++)
            this.parts.push(
              new Particle(
                e.cx(),
                e.cy(),
                (Math.random() - 0.5) * 120,
                -Math.random() * 120,
                "#ffffff",
                0.4,
                2,
              ),
            );
        };

        Game.prototype.killPlayer = function (fell) {
          if (this.state !== "play") return;
          var p = this.player;
          p.state = "dead";
          p.deadT = 0;
          p.vx = 0;
          p.vy = fell ? 60 : -300;
          this.state = "dead";
          this.stateT = 0;
          Snd.stopMusic();
          Snd.die();
        };

        /* ------------- メイン更新 ------------- */
        Game.prototype.update = function (dt) {
          this.t += dt;
          this.stateT += dt;
          if (this.shake > 0) this.shake -= dt;

          if (this.state === "title") {
            if (Input.pressed.jump || Input.pressed.start) {
              this.reset();
              this.loadStage(1, false);
            }
            return;
          }
          if (this.state === "gameover") {
            if (
              this.stateT > 1 &&
              (Input.pressed.jump || Input.pressed.start)
            ) {
              this.state = "title";
              this.stateT = 0;
            }
            return;
          }
          if (this.state === "win") {
            if (
              this.stateT > 1.5 &&
              (Input.pressed.jump || Input.pressed.start)
            ) {
              this.state = "title";
              this.stateT = 0;
            }
            this.updateParticles(dt);
            if (this.stateT % 0.5 < dt) {
              for (var f = 0; f < 14; f++)
                this.parts.push(
                  new Particle(
                    Math.random() * VIEW_W,
                    Math.random() * VIEW_H * 0.6,
                    (Math.random() - 0.5) * 140,
                    (Math.random() - 0.5) * 140,
                    ["#ffd23a", "#e63225", "#7bd5ff", "#82e05a"][f % 4],
                    0.9,
                    2,
                  ),
                );
            }
            return;
          }
          if (this.state === "ready") {
            if (this.stateT > 1.6) {
              this.state = "play";
              this.stateT = 0;
              if (this.music) Snd.setTrack(this.level.music);
            }
            return;
          }
          if (this.state === "dead") {
            this.player.update(this, dt);
            this.updateParticles(dt);
            if (this.stateT > 2.4) {
              this.lives--;
              if (this.lives < 0) {
                this.state = "gameover";
                this.stateT = 0;
              } else {
                this.loadStage(this.stage, true);
              }
            }
            return;
          }
          if (this.state === "clear") {
            if (this.level.goalTop != null)
              this.flagY = Math.min(
                this.level.goalBottom - 10,
                this.flagY + 100 * dt,
              );
            this.player.update(this, dt);
            this.updateEnts(dt, true);
            this.updateParticles(dt);
            this.updateCamera(dt);
            if (this.flagDone && this.stateT > 4.2) {
              // 残り時間をスコアに
              this.score += Math.floor(this.timeLeft) * 50;
              if (this.stage >= STAGES.length) {
                this.state = "win";
                this.stateT = 0;
                Snd.stopMusic();
              } else {
                this.checkpoint = null;
                this.loadStage(this.stage + 1, false);
              }
            }
            return;
          }

          /* ---- state === 'play' ---- */
          var p = this.player;
          p.pby = p.y + p.h;
          p.update(this, dt);

          this.timeLeft -= dt;
          if (this.timeLeft <= 0) {
            this.timeLeft = 0;
            this.killPlayer(false);
            return;
          }

          this.updateEnts(dt, false);
          this.handlePlatforms(dt);
          this.handleCollisions(dt);
          this.updateParticles(dt);
          this.updateCamera(dt);

          // 穴・溶岩・トゲ
          if (p.y > this.level.h * T + 8) {
            this.killPlayer(true);
            return;
          }
          if (p.state === "play" && this.tileHazard(p)) {
            if (p.starTime > 0) {
              // スター中でも溶岩は即死しない：はじき返す
              p.vy = -260;
            } else {
              this.killPlayer(false);
              return;
            }
          }

          // ゴール
          var lv = this.level;
          if (
            p.state === "play" &&
            lv.goalTop != null &&
            p.x + p.w > lv.goalX + 2 &&
            p.x < lv.goalX + T + 2
          ) {
            p.state = "pole";
            p.x = lv.goalX - 6;
            p.vx = 0;
            p.vy = 0;
            var hRatio = clamp(
              1 - (p.y - lv.goalTop) / (lv.goalBottom - lv.goalTop),
              0,
              1,
            );
            var pts = [400, 800, 1000, 2000, 5000][
              Math.min(4, Math.floor(hRatio * 5))
            ];
            this.addScore(pts, p.cx(), p.y - 10, String(pts));
            this.state = "clear";
            this.stateT = 0;
            Snd.stopMusic();
            Snd.flag();
          }

          // ボスの門
          if (lv.gate && this.bossDown && !lv.gateOpen) {
            lv.gateOpen = true;
            for (var gy = lv.gate.y0; gy < lv.gate.y1; gy++) {
              lv.set(lv.gate.x, gy, TL.EMPTY);
              this.parts.push(
                new Particle(
                  lv.gate.x * T + 8,
                  gy * T + 8,
                  (Math.random() - 0.5) * 100,
                  -Math.random() * 140,
                  "#c8c8d8",
                  0.8,
                  3,
                ),
              );
            }
            this.shake = 0.5;
          }
        };

        Game.prototype.tileHazard = function (p) {
          var x0 = Math.floor((p.x + 2) / T),
            x1 = Math.floor((p.x + p.w - 2) / T);
          var y0 = Math.floor((p.y + p.h * 0.5) / T),
            y1 = Math.floor((p.y + p.h - 1) / T);
          for (var x = x0; x <= x1; x++)
            for (var y = y0; y <= y1; y++)
              if (this.level.isHazard(x, y)) return true;
          return false;
        };

        Game.prototype.updateEnts = function (dt, freeze) {
          var camL = this.camX - 80,
            camR = this.camX + VIEW_W + 80;
          for (var i = 0; i < this.ents.length; i++) {
            var e = this.ents[i];
            if (e === this.player || e.remove) continue;
            if (!e.active) {
              if (e.alwaysActive || (e.x < camR && e.x + e.w > camL - 200))
                e.active = true;
              else continue;
            }
            if (freeze && e.enemy) continue;
            if (e.update) e.update(this, dt);
            if (e.y > this.level.h * T + 80) e.remove = true;
            if (e.type === "shell" && !e.moving && e.idle > 12) e.remove = true;
          }
          // 掃除
          var out = [];
          for (var k = 0; k < this.ents.length; k++)
            if (!this.ents[k].remove) out.push(this.ents[k]);
          this.ents = out;
        };

        Game.prototype.handlePlatforms = function (dt) {
          var p = this.player;
          if (p.state !== "play") return;
          for (var i = 0; i < this.ents.length; i++) {
            var pl = this.ents[i];
            if (!pl.platform || pl.remove) continue;
            if (p.x + p.w <= pl.x + 1 || p.x >= pl.x + pl.w - 1) continue;
            var bottom = p.y + p.h;
            if (
              p.vy >= -1 &&
              p.pby <= pl.py + 6 &&
              bottom >= pl.y - 1 &&
              bottom <= pl.y + pl.h + 8
            ) {
              p.y = pl.y - p.h;
              p.vy = 0;
              p.onGround = true;
              p.coyote = PHYS.coyote;
              p.x += pl.dx;
              p.y += pl.dy;
              if (pl.type === "fallplat") pl.triggered = true;
            }
          }
        };

        Game.prototype.handleCollisions = function (dt) {
          var p = this.player;
          if (p.state !== "play") return;
          var i, e;

          for (i = 0; i < this.ents.length; i++) {
            e = this.ents[i];
            if (e === p || e.remove || !e.active || e.platform) continue;
            if (Math.abs(e.x - p.x) > 320) continue;

            // ファイアボール vs 敵
            if (e.enemy && !e.harmless) {
              for (var f = 0; f < this.ents.length; f++) {
                var fb = this.ents[f];
                if (fb.type !== "fireball" || fb.remove) continue;
                if (overlaps(fb, e)) {
                  fb.remove = true;
                  this.puff(fb.cx(), fb.cy());
                  if (e.boss) e.damage(this);
                  else if (e.type === "piranha" && e.hidden) {
                  } else this.defeatEnemy(e, true);
                }
              }
            }

            if (!overlaps(p, e)) continue;

            if (e.type === "checkpoint") {
              if (!e.taken) {
                e.taken = true;
                this.checkpoint = {
                  stage: this.stage,
                  x: e.x - 8,
                  y: e.y + e.h - 32,
                  size: p.size,
                  power: p.power,
                };
                Snd.power();
                this.pops.push(new Popup(e.cx(), e.y - 6, "CHECK!", "#ffd23a"));
              }
              continue;
            }

            if (e.item) {
              e.remove = true;
              if (e.type === "coin") {
                this.coins++;
                this.addScore(100);
                Snd.coin();
                this.checkCoinLife();
                this.parts.push(
                  new Particle(e.cx(), e.cy(), 0, -150, "#ffd23a", 0.35, 3),
                );
                this.checkCoinLife();
              } else if (e.type === "mushroom") {
                p.grow(this, "big");
                this.addScore(1000, e.cx(), e.y, "1000");
              } else if (e.type === "flower") {
                p.grow(this, "fire");
                this.addScore(1000, e.cx(), e.y, "1000");
              } else if (e.type === "oneup") {
                this.lives++;
                Snd.oneup();
                this.pops.push(new Popup(e.cx(), e.y, "1UP", "#82e05a"));
              } else if (e.type === "star") {
                p.starTime = 10;
                p.comboBase = 0;
                Snd.power();
                if (this.music) Snd.setTrack("sky");
                this.addScore(1000, e.cx(), e.y, "1000");
              }
              continue;
            }

            if (e.harmless) continue;
            if (e.type === "piranha" && e.hidden) continue;

            // スター無敵
            if (p.starTime > 0) {
              if (e.boss) e.damage(this);
              else this.defeatEnemy(e, true);
              continue;
            }

            var stomping = p.vy > 20 && p.pby <= e.y + Math.min(8, e.h * 0.6);

            if (e.type === "shell") {
              if (stomping) {
                e.stomped(this);
                p.vy = Input.held.jump ? -300 : -210;
                p.pby = p.y + p.h;
              } else if (!e.moving) {
                e.kick(this, p.cx() < e.cx() ? 1 : -1);
                this.addScore(400, e.cx(), e.y, "400");
              } else {
                p.hurt(this);
              }
              continue;
            }

            if (stomping && e.stompable) {
              e.stomped(this);
              var idx = Math.min(p.comboBase, STOMP_CHAIN.length - 1);
              this.addScore(
                STOMP_CHAIN[idx],
                e.cx(),
                e.y,
                String(STOMP_CHAIN[idx]),
              );
              p.comboBase++;
              p.vy = Input.held.jump ? -300 : -215;
              p.pby = p.y + p.h;
              Snd.stomp();
            } else {
              p.hurt(this);
            }
          }
          if (p.onGround) p.comboBase = 0;
        };

        Game.prototype.updateParticles = function (dt) {
          var i;
          for (i = this.parts.length - 1; i >= 0; i--) {
            var pt = this.parts[i];
            pt.life -= dt;
            if (pt.life <= 0) {
              this.parts.splice(i, 1);
              continue;
            }
            pt.vy += 600 * dt;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
          }
          for (i = this.pops.length - 1; i >= 0; i--) {
            var po = this.pops[i];
            po.life -= dt;
            po.y -= 26 * dt;
            if (po.life <= 0) this.pops.splice(i, 1);
          }
          for (i = this.bumps.length - 1; i >= 0; i--) {
            this.bumps[i].t += dt;
            if (this.bumps[i].t > 0.22) this.bumps.splice(i, 1);
          }
        };

        Game.prototype.updateCamera = function (dt) {
          var p = this.player,
            lv = this.level;
          var tx = clamp(
            p.cx() - VIEW_W * 0.42,
            0,
            Math.max(0, lv.w * T - VIEW_W),
          );
          var ty = clamp(
            p.cy() - VIEW_H * 0.58,
            0,
            Math.max(0, lv.h * T - VIEW_H),
          );
          this.camX = lerp(this.camX, tx, Math.min(1, 9 * dt));
          this.camY = lerp(this.camY, ty, Math.min(1, 6 * dt));
        };
        /* =====================================================
         * 16. 描画
         * ===================================================== */
        function Renderer(canvas) {
          this.cv = canvas;
          this.g = canvas ? ctx2d(canvas) : STUB_CTX;
        }

        function marioSprite(p, t) {
          var group = A.mario[p.size];
          var set;
          if (p.starTime > 0) set = group.star[Math.floor(t * 18) % 3];
          else if (p.power === "fire") set = group.fire;
          else set = group.normal;
          var key = "idle";
          if (p.state === "pole") key = "jump";
          else if (p.frame === "walk")
            key = ["walk1", "walk2", "walk3", "walk2"][Math.floor(p.animT) % 4];
          else if (p.frame === "jump") key = "jump";
          else if (p.frame === "skid") key = "skid";
          return set[key];
        }

        Renderer.prototype.tileImg = function (lv, id, t) {
          var ts = A.tiles[lv.theme];
          switch (id) {
            case TL.GROUND:
              return ts.ground;
            case TL.TOP:
              return ts.top;
            case TL.BRICK:
              return ts.brick;
            case TL.HARD:
              return ts.hard;
            case TL.USED:
              return ts.used;
            case TL.SEMI:
              return ts.semi;
            case TL.Q:
              return Math.floor(t * 4) % 4 === 0 ? A.common.q1 : A.common.q0;
            case TL.PIPE_TL:
              return A.common.pipeTL;
            case TL.PIPE_TR:
              return A.common.pipeTR;
            case TL.PIPE_BL:
              return A.common.pipeBL;
            case TL.PIPE_BR:
              return A.common.pipeBR;
            case TL.SPIKE:
              return A.common.spike;
            case TL.LAVA:
              return Math.floor(t * 6) % 2 ? A.common.lava1 : A.common.lava0;
            case TL.WATER:
              return Math.floor(t * 5) % 2 ? A.common.water1 : A.common.water0;
            case TL.POLE:
              return A.common.pole;
            case TL.POLETOP:
              return A.common.poleTop;
          }
          return null;
        };

        Renderer.prototype.draw = function (game) {
          if (HEADLESS) return;
          var g = this.g,
            W = this.cv.width,
            H = this.cv.height;
          g.setTransform(1, 0, 0, 1, 0, 0);
          g.imageSmoothingEnabled = false;

          if (game.state === "title") {
            this.drawTitle(game);
            return;
          }
          var lv = game.level;
          if (!lv) return;

          var th = THEMES[lv.theme];
          var grd = g.createLinearGradient(0, 0, 0, H);
          grd.addColorStop(0, th.sky[0]);
          grd.addColorStop(1, th.sky[1]);
          g.fillStyle = grd;
          g.fillRect(0, 0, W, H);

          var shx = 0,
            shy = 0;
          if (game.shake > 0) {
            shx = (Math.random() - 0.5) * 8 * game.shake;
            shy = (Math.random() - 0.5) * 8 * game.shake;
          }
          g.save();
          g.scale(ZOOM, ZOOM);
          g.translate(
            -Math.round(game.camX) + shx,
            -Math.round(game.camY) + shy,
          );

          this.drawDecor(game, lv, 0.45, ["cloud", "star"]);
          this.drawDecor(game, lv, 0.78, ["hill", "tree"]);
          this.drawDecor(game, lv, 1, ["bush", "torch", "castle"]);
          this.drawTiles(game, lv);
          if (lv.goalTop != null)
            g.drawImage(
              A.common.flag,
              Math.round(lv.goalX - 7),
              Math.round(game.flagY),
            );
          this.drawEnts(game);
          this.drawParticles(game);

          g.restore();
          this.drawHUD(game);
          this.drawOverlay(game);
        };

        Renderer.prototype.drawDecor = function (game, lv, par, kinds) {
          var g = this.g;
          var offset = game.camX * (1 - par);
          for (var i = 0; i < lv.decor.length; i++) {
            var d = lv.decor[i];
            if (kinds.indexOf(d.kind) < 0) continue;
            var x = d.x + offset;
            if (x < game.camX - 160 || x > game.camX + VIEW_W + 160) continue;
            if (d.kind === "star") {
              var a = 0.4 + 0.6 * Math.abs(Math.sin(game.t * 1.4 + d.x));
              g.fillStyle = "rgba(255,255,255," + a.toFixed(2) + ")";
              g.fillRect(x, d.y, 2, 2);
              continue;
            }
            if (d.kind === "torch") {
              var img = A.common.torch;
              g.drawImage(img, Math.round(x), Math.round(d.y));
              g.fillStyle = "rgba(255,140,24,0.16)";
              var r = 16 + Math.sin(game.t * 8 + d.x) * 2;
              g.beginPath();
              g.arc(x + 4, d.y + 4, r, 0, Math.PI * 2);
              g.fill();
              continue;
            }
            var im =
              d.kind === "cloud"
                ? A.common.cloud
                : d.kind === "hill"
                  ? A.common.hill
                  : d.kind === "bush"
                    ? A.common.bush
                    : d.kind === "tree"
                      ? A.common.tree
                      : A.common.castle;
            // 雲は上端基準、それ以外は「地面に立つ」ように下端基準
            var yy = d.kind === "cloud" ? d.y : d.y - im.height;
            g.drawImage(im, Math.round(x), Math.round(yy));
          }
        };

        Renderer.prototype.drawTiles = function (game, lv) {
          var g = this.g;
          var x0 = Math.max(0, Math.floor(game.camX / T) - 1);
          var x1 = Math.min(lv.w - 1, Math.ceil((game.camX + VIEW_W) / T) + 1);
          var y0 = Math.max(0, Math.floor(game.camY / T) - 1);
          var y1 = Math.min(lv.h - 1, Math.ceil((game.camY + VIEW_H) / T) + 1);
          for (var y = y0; y <= y1; y++) {
            for (var x = x0; x <= x1; x++) {
              var id = lv.get(x, y);
              if (!id) continue;
              var img = this.tileImg(lv, id, game.t);
              if (!img) continue;
              var oy = 0;
              for (var b = 0; b < game.bumps.length; b++) {
                var bm = game.bumps[b];
                if (bm.tx === x && bm.ty === y)
                  oy = -Math.sin((bm.t / 0.22) * Math.PI) * 7;
              }
              g.drawImage(img, x * T, y * T + oy);
            }
          }
        };

        Renderer.prototype.drawEnts = function (game) {
          var g = this.g;
          var t = game.t;
          for (var i = 0; i < game.ents.length; i++) {
            var e = game.ents[i];
            if (e.remove) continue;
            if (e.x > game.camX + VIEW_W + 48 || e.x + e.w < game.camX - 48)
              continue;
            if (e === game.player) continue;
            this.drawEnt(game, e, t);
          }
          // プレイヤーは最前面
          var p = game.player;
          if (p && !(p.invuln > 0 && Math.floor(t * 20) % 2))
            this.drawEnt(game, p, t);
        };

        Renderer.prototype.drawEnt = function (game, e, t) {
          var g = this.g;
          var img = null,
            flip = false;

          switch (e.type) {
            case "player":
              img = marioSprite(e, t);
              flip = e.dir < 0;
              break;
            case "goomba":
              img =
                e.squash > 0
                  ? A.spr.goombaFlat
                  : Math.floor(t * 7) % 2
                    ? A.spr.goomba1
                    : A.spr.goomba2;
              break;
            case "koopa":
              img = Math.floor(t * 6) % 2 ? A.spr.koopa1 : A.spr.koopa2;
              flip = e.vx > 0;
              break;
            case "shell":
              img = A.spr.shell;
              break;
            case "spiny":
              img = Math.floor(t * 7) % 2 ? A.spr.spiny1 : A.spr.spiny2;
              break;
            case "piranha":
              // 土管から出ている分だけを切り出して描く
              var pim = Math.floor(t * 5) % 2 ? A.spr.piranha1 : A.spr.piranha2;
              var vh = Math.max(0, Math.round((e.out || 0) * 16));
              if (vh > 0)
                g.drawImage(
                  pim,
                  0,
                  0,
                  16,
                  vh,
                  Math.round(e.x + e.ox),
                  Math.round(e.baseY - vh),
                  16,
                  vh,
                );
              return;
            case "lakitu":
              img = A.spr.lakitu;
              flip = e.vx > 0;
              break;
            case "hammerbro":
              img = Math.floor(t * 3) % 2 ? A.spr.hammerbro1 : A.spr.hammerbro2;
              flip = e.vx > 0;
              break;
            case "hammer":
              img = A.spr.hammer;
              break;
            case "fireball":
              img = A.spr.fireball;
              break;
            case "coin":
              var ci = Math.floor(t * 8 + e.x * 0.1) % 4;
              img = [A.spr.coin1, A.spr.coin2, A.spr.coin3, A.spr.coin2][ci];
              break;
            case "mushroom":
              img = A.spr.mushroom;
              break;
            case "oneup":
              img = A.spr.oneup;
              break;
            case "flower":
              img = Math.floor(t * 6) % 2 ? A.spr.flower1 : A.spr.flower2;
              break;
            case "star":
              img = Math.floor(t * 10) % 2 ? A.spr.star1 : A.spr.star2;
              break;
            case "bowser":
              img = A.spr.bowser;
              flip = e.dir > 0;
              break;
            case "bossfire":
              g.fillStyle = Math.floor(t * 20) % 2 ? "#ff8c18" : "#ffd23a";
              g.fillRect(e.x, e.y + 1, e.w, e.h - 2);
              g.fillStyle = "#ffffff";
              g.fillRect(e.x + 2, e.y + 3, e.w - 4, 2);
              return;
            case "plat":
            case "fallplat":
              var img2 = A.tiles[game.level.theme].semi;
              for (var k = 0; k < e.tiles; k++)
                g.drawImage(img2, Math.round(e.x + k * T), Math.round(e.y));
              g.fillStyle = "rgba(0,0,0,0.25)";
              g.fillRect(Math.round(e.x), Math.round(e.y) + 7, e.w, 2);
              return;
            case "checkpoint":
              g.fillStyle = "#c8c8d8";
              g.fillRect(Math.round(e.x) + 3, Math.round(e.y), 3, e.h);
              g.fillStyle = e.taken ? "#82e05a" : "#e63225";
              var wv = e.taken ? Math.sin(t * 6) * 2 : 0;
              g.beginPath();
              g.moveTo(e.x + 6, e.y + 2);
              g.lineTo(e.x + 22 + wv, e.y + 8);
              g.lineTo(e.x + 6, e.y + 14);
              g.closePath();
              g.fill();
              return;
          }
          if (!img) return;
          var sc = e.scale || 1;
          var dx = Math.round(e.x + e.ox),
            dy = Math.round(e.y + e.oy);
          if (sc !== 1) {
            if (e.hitFlash > 0 && Math.floor(t * 24) % 2) return;
            g.save();
            if (flip) {
              g.translate(dx + img.width * sc, dy);
              g.scale(-sc, sc);
            } else {
              g.translate(dx, dy);
              g.scale(sc, sc);
            }
            g.drawImage(img, 0, 0);
            g.restore();
            return;
          }
          if (e.type === "player" && e.state === "grow")
            dy += Math.floor(Math.sin(e.morphT * 40) * 1.5);
          if (e.hitFlash > 0 && Math.floor(t * 24) % 2) return;
          if (flip) {
            g.save();
            g.translate(dx + img.width, dy);
            g.scale(-1, 1);
            g.drawImage(img, 0, 0);
            g.restore();
          } else {
            g.drawImage(img, dx, dy);
          }
        };

        Renderer.prototype.drawParticles = function (game) {
          var g = this.g,
            i;
          for (i = 0; i < game.parts.length; i++) {
            var p = game.parts[i];
            g.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
            g.fillStyle = p.color;
            g.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
          }
          g.globalAlpha = 1;
          g.font = "8px monospace";
          g.textAlign = "center";
          for (i = 0; i < game.pops.length; i++) {
            var po = game.pops[i];
            g.globalAlpha = Math.max(0, Math.min(1, po.life / 0.9));
            g.fillStyle = "#000000";
            g.fillText(po.text, Math.round(po.x) + 1, Math.round(po.y) + 1);
            g.fillStyle = po.color;
            g.fillText(po.text, Math.round(po.x), Math.round(po.y));
          }
          g.globalAlpha = 1;
          g.textAlign = "left";
        };

        /* --------- HUD（等倍で描いて文字をくっきり） --------- */
        function pad(n, len) {
          var s = String(Math.max(0, Math.floor(n)));
          while (s.length < len) s = "0" + s;
          return s;
        }
        Renderer.prototype.drawHUD = function (game) {
          var g = this.g,
            W = this.cv.width;
          g.save();
          g.setTransform(1, 0, 0, 1, 0, 0);
          var h = 44;
          g.fillStyle = "rgba(10,14,32,0.55)";
          g.fillRect(0, 0, W, h);
          g.fillStyle = "rgba(255,255,255,0.18)";
          g.fillRect(0, h - 2, W, 2);

          g.font = "bold 18px 'Courier New', monospace";
          g.textBaseline = "middle";
          g.fillStyle = "#ffffff";
          g.textAlign = "left";
          g.fillText("MARIO", 20, 14);
          g.fillText(pad(game.score, 7), 20, 32);

          g.fillStyle = "#ffffff";
          g.fillText("COIN", 200, 14);
          g.drawImage(A.spr.coin1, 196, 24, 16, 16);
          g.fillStyle = "#ffd23a";
          g.fillText("x" + pad(game.coins, 2), 216, 32);

          g.textAlign = "center";
          g.fillText("WORLD", W / 2 - 60, 14);
          g.fillText(game.stage + " - 1", W / 2 - 60, 32);

          g.fillText("TIME", W / 2 + 80, 14);
          g.fillStyle = game.timeLeft < 60 ? "#ff6a4a" : "#ffffff";
          g.fillText(pad(game.timeLeft, 3), W / 2 + 80, 32);

          g.fillStyle = "#ffffff";
          g.textAlign = "right";
          g.fillText("LIVES", W - 22, 14);
          g.fillStyle = "#82e05a";
          g.fillText("x " + Math.max(0, game.lives), W - 22, 32);

          if (game.level && game.level.name) {
            g.textAlign = "left";
            g.font = "12px sans-serif";
            g.fillStyle = "rgba(255,255,255,0.5)";
            g.fillText(game.level.name, 20, 56);
          }
          g.restore();
        };

        Renderer.prototype.banner = function (lines, sub) {
          var g = this.g,
            W = this.cv.width,
            H = this.cv.height;
          g.save();
          g.setTransform(1, 0, 0, 1, 0, 0);
          g.fillStyle = "rgba(0,0,0,0.62)";
          g.fillRect(0, 0, W, H);
          g.textAlign = "center";
          g.textBaseline = "middle";
          for (var i = 0; i < lines.length; i++) {
            g.font =
              "bold " + (i === 0 ? 44 : 26) + "px 'Arial Black', sans-serif";
            g.lineWidth = 8;
            g.strokeStyle = "#000";
            g.fillStyle = i === 0 ? "#ffd23a" : "#ffffff";
            var y = H / 2 - 40 + i * 52;
            g.strokeText(lines[i], W / 2, y);
            g.fillText(lines[i], W / 2, y);
          }
          if (sub) {
            g.font = "16px sans-serif";
            g.fillStyle = "rgba(255,255,255,0.85)";
            g.fillText(sub, W / 2, H - 70);
          }
          g.restore();
        };

        Renderer.prototype.drawOverlay = function (game) {
          if (game.state === "ready") {
            var p = game.player;
            this.banner(
              [game.level.name, "マリオ x " + Math.max(0, game.lives)],
              "",
            );
          } else if (game.state === "dead") {
            // 何も出さない（演出のみ）
          } else if (game.state === "clear") {
            if (game.flagDone)
              this.banner(
                [
                  "COURSE CLEAR!",
                  "TIME BONUS  " + Math.floor(game.timeLeft) * 50,
                ],
                "",
              );
          } else if (game.state === "gameover") {
            this.banner(
              ["GAME OVER", "SCORE  " + pad(game.score, 7)],
              "スペース / タップでタイトルへ",
            );
          } else if (game.state === "win") {
            this.banner(
              [
                "CONGRATULATIONS!",
                "クッパをたおした！  SCORE " + pad(game.score, 7),
              ],
              "スペース / タップでタイトルへ",
            );
          } else if (game.paused) {
            this.banner(["PAUSE"], "P / ESC で再開");
          }
        };

        Renderer.prototype.drawTitle = function (game) {
          var g = this.g,
            W = this.cv.width,
            H = this.cv.height,
            t = game.t;
          var grd = g.createLinearGradient(0, 0, 0, H);
          grd.addColorStop(0, "#5c94fc");
          grd.addColorStop(1, "#9fd7ff");
          g.fillStyle = grd;
          g.fillRect(0, 0, W, H);

          g.save();
          g.scale(ZOOM, ZOOM);
          for (var i = 0; i < 6; i++) {
            var cx = ((i * 97 + t * 8) % (VIEW_W + 64)) - 64;
            g.drawImage(A.common.cloud, cx, 20 + (i % 3) * 26);
          }
          g.drawImage(A.common.hill, 20, VIEW_H - 96);
          g.drawImage(A.common.hill, 200, VIEW_H - 96);
          g.drawImage(A.common.bush, 300, VIEW_H - 68);
          var ts = A.tiles.overworld;
          for (var x = 0; x < VIEW_W + T; x += T) {
            g.drawImage(ts.top, x, VIEW_H - 48);
            g.drawImage(ts.ground, x, VIEW_H - 32);
            g.drawImage(ts.ground, x, VIEW_H - 16);
          }
          var mv = Math.sin(t * 2) * 40 + VIEW_W / 2 - 8;
          var frames = ["walk1", "walk2", "walk3", "walk2"];
          var f = A.mario.big.normal[frames[Math.floor(t * 8) % 4]];
          g.save();
          if (Math.cos(t * 2) < 0) {
            g.translate(mv + f.width, VIEW_H - 48 - f.height);
            g.scale(-1, 1);
            g.drawImage(f, 0, 0);
          } else {
            g.drawImage(f, mv, VIEW_H - 48 - f.height);
          }
          g.restore();
          g.drawImage(A.spr.goomba1, mv + 70, VIEW_H - 48 - 16);
          g.restore();

          g.textAlign = "center";
          g.textBaseline = "middle";
          g.font = "bold 58px 'Arial Black', sans-serif";
          g.lineWidth = 12;
          g.strokeStyle = "#000";
          g.strokeText("SUPER MARIO", W / 2, 140);
          var gr2 = g.createLinearGradient(0, 110, 0, 175);
          gr2.addColorStop(0, "#fff4b0");
          gr2.addColorStop(0.5, "#ffd23a");
          gr2.addColorStop(1, "#e88a00");
          g.fillStyle = gr2;
          g.fillText("SUPER MARIO", W / 2, 140);

          g.font = "bold 34px 'Arial Black', sans-serif";
          g.lineWidth = 8;
          g.strokeText("ADVENTURE", W / 2, 196);
          g.fillStyle = "#ffffff";
          g.fillText("ADVENTURE", W / 2, 196);

          if (Math.floor(t * 2) % 2 === 0) {
            g.font = "bold 22px sans-serif";
            g.lineWidth = 6;
            g.strokeText("PRESS SPACE / TAP TO START", W / 2, 268);
            g.fillStyle = "#ffffff";
            g.fillText("PRESS SPACE / TAP TO START", W / 2, 268);
          }
          g.font = "15px sans-serif";
          g.fillStyle = "rgba(0,0,0,0.6)";
          g.fillText(
            "← → 移動  /  SPACE・Z ジャンプ  /  SHIFT・X ダッシュ＆ファイア  /  P ポーズ",
            W / 2,
            318,
          );
          g.fillText("全5ステージ  ‑  中間ポイントあり", W / 2, 342);
        };

        /* =====================================================
         * 17. 起動
         * ===================================================== */
        var game = new Game();
        var renderer = null;

        /* 画面サイズに合わせてキャンバスとタッチボタンを配置し直す。
         * 縦持ちのときは上に画面・下にボタン、横持ちのときは全画面＋
         * 手前にボタンを重ねる。 */
        function fitCanvas() {
          if (HEADLESS) return;
          var cv = document.getElementById("game");
          var stage = document.getElementById("stage");
          var bar = document.getElementById("topbar");
          var rot = document.getElementById("rotate");
          if (!cv || !stage) return;
          var vv = window.visualViewport;
          var W = Math.round(vv ? vv.width : window.innerWidth);
          var H = Math.round(vv ? vv.height : window.innerHeight);
          var touch = Input.touch;
          var portrait = H > W * 1.02;

          var safeB = 0;
          try {
            var probe = getComputedStyle(
              document.documentElement,
            ).getPropertyValue("--sab");
            safeB = parseInt(probe, 10) || 0;
          } catch (e) {}

          var scale, cw, ch, padTop;
          if (touch && portrait) {
            // 縦持ち：画面は上半分、下はコントローラ領域
            var availH = H * 0.5;
            scale = Math.min(W / 1024, availH / 576);
            cw = Math.floor(1024 * scale);
            ch = Math.floor(576 * scale);
            var offTop = Math.round(Math.min(H * 0.06, 56));
            padTop = offTop + ch;
            stage.style.alignItems = "flex-start";
            stage.style.paddingTop = offTop + "px";
          } else {
            scale = Math.min(W / 1024, H / 576);
            cw = Math.floor(1024 * scale);
            ch = Math.floor(576 * scale);
            padTop = H;
            stage.style.alignItems = "center";
            stage.style.paddingTop = "0px";
          }
          cv.style.width = cw + "px";
          cv.style.height = ch + "px";

          // 上部のチップ
          var chipFs = Math.max(10, Math.min(13, Math.round(W / 70)));
          if (bar && bar.children) {
            bar.style.top = (touch && portrait ? 6 : 8) + "px";
            bar.style.right = "8px";
            for (var c = 0; c < bar.children.length; c++) {
              var ch2 = bar.children[c];
              ch2.style.fontSize = chipFs + "px";
              ch2.style.padding =
                Math.round(chipFs * 0.5) +
                "px " +
                Math.round(chipFs * 0.85) +
                "px";
            }
          }
          var full = document.getElementById("cFull");
          if (full)
            full.style.display = document.documentElement.requestFullscreen
              ? ""
              : "none";

          if (!touch) {
            if (rot) rot.classList.remove("on");
            return;
          }

          // タッチボタンの配置
          // 縦持ち：← → を左、DASH を JUMP の真上に積む
          // 横持ち：← → を左、DASH / JUMP を右に少し段差をつけて置く
          var size, bottom, edge, gap, band;
          if (portrait) {
            band = H - padTop;
            edge = Math.round(Math.min(W * 0.05, 20));
            // ← → ＋ JUMP が横に並ぶので 3個分＋すき間が入る幅に収める
            size = Math.min(W * 0.23, band * 0.33, (W - 2 * edge) / 3.25, 120);
            size = Math.round(Math.max(52, size));
            gap = Math.round(size * 0.2);
            bottom = Math.round(
              clamp(band * 0.16, 14, Math.max(14, band - size * 2 - gap - 12)) +
                safeB,
            );
          } else {
            edge = Math.round(Math.max(10, Math.min(W * 0.025, 28)));
            size = Math.min(H * 0.24, (W - 2 * edge) / 4.4, 104);
            size = Math.round(Math.max(52, size));
            gap = Math.round(size * 0.16);
            bottom = Math.round(Math.max(10, Math.min(H * 0.05, 34)) + safeB);
          }

          // 縦持ちは下半分をパネルにして、余白を「本体」に見せる
          var deck = document.getElementById("deck");
          if (deck) {
            if (portrait) {
              deck.classList.add("on");
              deck.style.top = padTop + 6 + "px";
              deck.style.height = H - padTop - 6 + "px";
              deck.style.paddingTop =
                Math.round(Math.max(12, (H - padTop) * 0.07)) + "px";
              var tf = Math.max(11, Math.min(16, Math.round(W / 26)));
              var dt = document.getElementById("deckTitle");
              var dh = document.getElementById("deckHint");
              if (dt) dt.style.fontSize = tf + "px";
              if (dh) dh.style.fontSize = Math.round(tf * 0.72) + "px";
            } else deck.classList.remove("on");
          }

          function place(id, css) {
            var el = document.getElementById(id);
            if (!el) return;
            var s = css.size || size;
            el.style.width = s + "px";
            el.style.height = s + "px";
            el.style.bottom = css.bottom + "px";
            if (css.left != null) {
              el.style.left = css.left + "px";
              el.style.right = "auto";
            } else {
              el.style.right = css.right + "px";
              el.style.left = "auto";
            }
            el.style.fontSize =
              Math.round(s * (id === "bRun" ? 0.21 : 0.36)) + "px";
          }
          var runSize = Math.round(size * 0.84);
          place("bLeft", { left: edge, bottom: bottom });
          place("bRight", { left: edge + size + gap, bottom: bottom });
          place("bJump", { right: edge, bottom: bottom });
          if (portrait)
            place("bRun", {
              right: edge + Math.round((size - runSize) / 2),
              bottom: bottom + size + gap,
              size: runSize,
            });
          else
            place("bRun", {
              right: edge + size + gap,
              bottom: bottom + Math.round(size * 0.3),
              size: runSize,
            });

          if (rot) {
            // 縦持ちの案内は最初の数秒だけ
            if (portrait && !fitCanvas._rotShown) rot.classList.add("on");
            else rot.classList.remove("on");
          }
          setTimeout(function () {
            Input.refreshRects();
          }, 0);
        }

        function boot() {
          buildAssets();
          Input.init();
          if (!HEADLESS) {
            var cv = document.getElementById("game");
            renderer = new Renderer(cv);
            fitCanvas();
            Input.refreshRects();

            var relayout = function () {
              fitCanvas();
              Input.refreshRects();
            };
            window.addEventListener("resize", relayout);
            window.addEventListener("scroll", relayout, { passive: true });
            if (window.visualViewport) {
              window.visualViewport.addEventListener("resize", relayout);
              window.visualViewport.addEventListener("scroll", relayout);
            }
            window.addEventListener("orientationchange", function () {
              setTimeout(relayout, 120);
              setTimeout(relayout, 450);
            });
            // アドレスバーの出入りでサイズが変わることがあるので保険
            setInterval(function () {
              var vv = window.visualViewport;
              var w = Math.round(vv ? vv.width : window.innerWidth);
              var h = Math.round(vv ? vv.height : window.innerHeight);
              if (w !== relayout._w || h !== relayout._h) {
                relayout._w = w;
                relayout._h = h;
                relayout();
              }
            }, 600);

            // 縦持ちの案内は一度さわったら消す
            var rot = document.getElementById("rotate");
            var hideRot = function () {
              fitCanvas._rotShown = true;
              if (rot) rot.classList.remove("on");
            };
            if (rot)
              rot.addEventListener("pointerdown", hideRot, { passive: true });
            document.addEventListener("touchstart", hideRot, { passive: true });
            document.addEventListener("pointerdown", hideRot, {
              passive: true,
            });

            // バックグラウンドに回ったら自動でポーズ
            document.addEventListener("visibilitychange", function () {
              if (document.hidden && game.state === "play") game.paused = true;
            });

            // PC でスマホ表示を確認するための切り替え
            var padChip = document.getElementById("cPad");
            if (padChip) {
              var syncPadChip = function () {
                padChip.textContent = Input.touch
                  ? "📱 スマホ表示 ON"
                  : "📱 スマホ表示";
                padChip.style.background = Input.touch
                  ? "rgba(120,200,255,0.28)"
                  : "";
              };
              syncPadChip();
              padChip.addEventListener("click", function () {
                Input.setPad(!Input.touch);
                syncPadChip();
                relayout();
              });
            }

            var pauseChip = document.getElementById("cPause");
            if (pauseChip)
              pauseChip.addEventListener("click", function () {
                if (game.state !== "title") game.paused = !game.paused;
                pauseChip.textContent = game.paused ? "▶" : "❚❚";
              });

            var deckTitle = document.getElementById("deckTitle");
            var lastDeck = null;

            var soundChip = document.getElementById("cSound");
            soundChip.addEventListener("click", function () {
              Snd.on = !Snd.on;
              Snd.musicOn = Snd.on;
              soundChip.textContent = Snd.on ? "♪ ON" : "♪ OFF";
              if (Snd.on) {
                Snd.init();
                Snd.resume();
                if (game.state === "play") Snd.setTrack(game.level.music);
              }
            });
            var fullChip = document.getElementById("cFull");
            fullChip.addEventListener("click", function () {
              try {
                if (!document.fullscreenElement)
                  document.documentElement.requestFullscreen();
                else document.exitFullscreen();
              } catch (e) {}
            });

            var kick = function () {
              Snd.init();
              Snd.resume();
            };
            window.addEventListener("pointerdown", kick, { once: true });
            window.addEventListener("keydown", kick, { once: true });

            var last = performance.now();
            var acc = 0;
            var STEP = 1 / 120;
            var loop = function (now) {
              var dt = (now - last) / 1000;
              last = now;
              if (dt > 0.25) dt = 0.25;

              if (Input.pressed.pause && game.state !== "title")
                game.paused = !game.paused;
              if (Input.pressed.mute) {
                Snd.on = !Snd.on;
                Snd.musicOn = Snd.on;
                soundChip.textContent = Snd.on ? "♪ ON" : "♪ OFF";
              }

              if (!game.paused) {
                acc += dt;
                var guard = 0;
                while (acc >= STEP && guard++ < 8) {
                  game.update(STEP);
                  acc -= STEP;
                }
              }
              if (deckTitle) {
                var dtxt =
                  game.state === "title"
                    ? "SUPER MARIO ADVENTURE"
                    : game.level && game.level.name
                      ? game.level.name
                      : "";
                if (dtxt !== lastDeck) {
                  deckTitle.textContent = dtxt;
                  lastDeck = dtxt;
                }
              }
              Snd.musicTick();
              renderer.draw(game);
              Input.endFrame();
              requestAnimationFrame(loop);
            };
            requestAnimationFrame(loop);
          }
        }

        window.MARIO_TEST = {
          Game: Game,
          Level: Level,
          STAGES: STAGES,
          Input: Input,
          Player: Player,
          Renderer: Renderer,
          buildAssets: buildAssets,
          consts: {
            T: T,
            VIEW_W: VIEW_W,
            VIEW_H: VIEW_H,
            ROWS: ROWS,
            GROUND_ROW: GROUND_ROW,
            PHYS: PHYS,
          },
          art: { SMALL: SMALL, BIG: BIG, ART: ART },
          TL: TL,
          SOLID: SOLID,
          newGame: function () {
            return new Game();
          },
          getGame: function () {
            return game;
          },
          setGame: function (gm) {
            game = gm;
          },
          assets: function () {
            return A;
          },
        };

        if (HEADLESS) {
          buildAssets();
        } else if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </body>
</html>
